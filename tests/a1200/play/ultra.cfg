// ultra.cfg - the port's Ultra quality: Doom 3's Ultra preset (com_machineSpec 3:
// full-size textures, normal maps and specular maps, 8x anisotropy; patch 0033
// keeps the precompressed textures) with the effects of high.cfg, but shadows
// off (r_shadows 0). The game runs it after the preset (the menu's quality
// choice, or QUALITY=ultra).
set r_shadows 0
set r_skipPostProcess 0
set r_useInteractionScissors 1
set g_decals 1
set g_bloodEffects 1
set g_projectileLights 1
set g_doubleVision 1
set g_muzzleFlash 1
set g_showBrass 1
// sound as in low.cfg: every sound decoded at load
set s_decompressionLimit 60
