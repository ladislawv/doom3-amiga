// ultra.cfg - QUALITY=ultra: Doom 3's Ultra preset (com_machineSpec 3:
// uncompressed full-size textures, normal maps and specular maps, 8x
// anisotropy) with the effects of high.cfg, but shadows off (r_shadows 0),
// to see whether Ultra's textures run here without the shadows' cost.
set com_machineSpec 3
execMachineSpec
set r_shadows 0
set r_skipPostProcess 0
set r_useInteractionScissors 1
set g_decals 1
set g_bloodEffects 1
set g_projectileLights 1
set g_doubleVision 1
set g_muzzleFlash 1
set g_showBrass 1
// sound as in low.cfg: every sound decoded at load
set s_decompressionLimit 60
