// high.cfg - the port's High quality: Doom 3's High preset (com_machineSpec 2:
// full-size textures, 8x anisotropy, precompressed textures), with the effects
// low.cfg turns off back on. The game runs it after the preset (patch 0033: the
// menu's quality choice, or QUALITY=high).
set r_shadows 1
set r_skipPostProcess 0
set r_useInteractionScissors 1
set g_decals 1
set g_bloodEffects 1
set g_projectileLights 1
set g_doubleVision 1
set g_muzzleFlash 1
set g_showBrass 1
// sound as in low.cfg: every sound decoded at load
set s_decompressionLimit 60
