// high.cfg - Run-Play QUALITY=high: Doom 3's High preset (com_machineSpec 2:
// full-size textures, 8x anisotropy, precompressed textures), with the effects
// low.cfg turns off back on. Run-Play copies it to save/demo/ and adds
// +exec high.cfg (after the game's own detection, which picks "Ultra").
set com_machineSpec 2
execMachineSpec
set r_shadows 1
set r_skipPostProcess 0
set r_useInteractionScissors 1
set g_decals 1
set g_bloodEffects 1
set g_projectileLights 1
set g_doubleVision 1
set g_muzzleFlash 1
set g_showBrass 1
// sound as in low.cfg: every sound decoded at load
set s_decompressionLimit 60
