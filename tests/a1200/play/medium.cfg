// medium.cfg - the port's Medium quality: Doom 3's Medium preset (com_machineSpec 1:
// full-size textures, compressed normal maps, no anisotropy) with shadows off
// (as high.cfg) and the cosmetic extras off (as low.cfg). The game runs it after
// the preset (patch 0033: the menu's quality choice, or QUALITY=medium).
set image_anisotropy 0
// shadows off at every quality (the developer, 2026-11-13); r_shadows 1 in the console turns them on
set r_shadows 0
set r_skipPostProcess 1
set r_usePhong 0
set r_useInteractionScissors 1
set g_decals 0
set g_bloodEffects 0
set g_doubleVision 0
set g_showBrass 0
set g_projectileLights 1
set g_muzzleFlash 1
// sound as in low.cfg
set s_maxSoundsPerShader 1
set s_decompressionLimit 60
