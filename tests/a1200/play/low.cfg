// low.cfg - Run-Play QUALITY=low (the default): Doom 3's Low preset, and the
// costly effects off. Run-Play copies it to save/demo/ and adds +exec low.cfg
// (after the game's own detection, which picks "Ultra" from the memory).
set com_machineSpec 0
set image_downSize 1
set image_downSizeSpecular 1
set image_downSizeBump 1
set image_ignoreHighQuality 1
set image_anisotropy 0
set r_shadows 0
set r_skipPostProcess 1
set r_usePhong 0
set r_useInteractionScissors 0
set g_decals 0
set g_bloodEffects 0
set g_projectileLights 0
set g_doubleVision 0
set g_muzzleFlash 0
set g_showBrass 0
